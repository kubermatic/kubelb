# Regression test for kubermatic/kubelb#593: the leader-election Role must
# grant core/v1 (apiGroups "") events create/patch so the elector's legacy
# event recorder is not rejected on leadership acquisition. The manager
# acquires the lease either way (configmaps and leases are granted), so the
# only visible symptom is a "Server rejected event (will not retry!)" log
# line for the became-leader event. This test fails while the rule is
# missing and passes once the chart Role grants it.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: leader-election-rbac
  labels:
    all:
    feature: rbac
    resource: role
    test: leader-election-rbac
spec:
  description: >-
    Verify the manager's leader-election RBAC grants core/v1 events
    create/patch: leadership must be acquired, no leader-election event may
    be rejected, and the manager service account must be able to create
    core/v1 events (issue #593).
  steps:
    # Precondition: the manager is up and leading. Leader election works
    # regardless of the events grant, so this only rules out a manager that
    # never started (which would make the checks below vacuous).
    - name: manager-acquires-lease
      cluster: kubelb
      try:
        - script:
            timeout: 130s
            content: |
              set -euo pipefail
              for i in $(seq 1 30); do
                D=$(kubectl -n kubelb get deploy -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.template.spec.containers[*].name}{"\n"}{end}' 2>/dev/null | awk '{for(j=2;j<=NF;j++) if($j=="manager"){print $1; exit}}' || true)
                if [ -n "$D" ]; then
                  if kubectl -n kubelb logs "deployment/$D" -c manager 2>/dev/null | grep -q 'Successfully acquired lease'; then
                    echo "manager $D acquired the leader lease"
                    exit 0
                  fi
                fi
                sleep 4
              done
              echo "manager never acquired the leader lease"
              kubectl -n kubelb logs "deployment/$D" -c manager --tail 50 || true
              exit 1
    # The actual regression check: while the core/v1 events rule is missing,
    # client-go's legacy recorder logs "Server rejected event (will not
    # retry!)" with reason LeaderElection at every leadership acquisition.
    - name: no-rejected-leader-election-event
      cluster: kubelb
      try:
        - script:
            timeout: 30s
            content: |
              set -euo pipefail
              D=$(kubectl -n kubelb get deploy -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.template.spec.containers[*].name}{"\n"}{end}' 2>/dev/null | awk '{for(j=2;j<=NF;j++) if($j=="manager"){print $1; exit}}')
              [ -n "$D" ] || { echo "no deployment with a manager container found in ns kubelb"; kubectl -n kubelb get deploy; exit 1; }
              if kubectl -n kubelb logs "deployment/$D" -c manager | grep 'Server rejected event'; then
                echo "FAIL: leader-election event rejected - the leader-election Role is missing the core/v1 events rule (issue #593)"
                exit 1
              fi
              echo "OK: no rejected events in manager logs"
    # Ground truth from the API server: the manager service account must be
    # able to create core/v1 events (auth can-i walks the same RBAC
    # evaluation the event write uses).
    - name: serviceaccount-can-create-core-events
      cluster: kubelb
      try:
        - script:
            timeout: 30s
            content: |
              set -euo pipefail
              D=$(kubectl -n kubelb get deploy -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.template.spec.containers[*].name}{"\n"}{end}' 2>/dev/null | awk '{for(j=2;j<=NF;j++) if($j=="manager"){print $1; exit}}')
              [ -n "$D" ] || { echo "no deployment with a manager container found in ns kubelb"; kubectl -n kubelb get deploy; exit 1; }
              SA=$(kubectl -n kubelb get deploy "$D" -o jsonpath='{.spec.template.spec.serviceAccountName}')
              OUT=$(kubectl -n kubelb auth can-i create events --as="system:serviceaccount:kubelb:${SA}")
              echo "auth can-i create events as kubelb/${SA}: ${OUT}"
              [ "$OUT" = "yes" ] || { echo "FAIL: ${SA} cannot create core/v1 events (issue #593)"; exit 1; }
